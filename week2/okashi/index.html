<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好きなお菓子まとめ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>好きなお菓子まとめ</h1>
    <p>何度でも食べたくなる、お気に入りの5つ。</p>
  </header>

  <main class="cards">
    <article class="card">
      <img src="images/dorayaki.svg" alt="どら焼きのイメージ画像">
      <h2>どら焼き</h2>
      <p>ふんわりした皮と、たっぷりのあんこがうれしい定番の和菓子。</p>
    </article>

    <article class="card">
      <img src="images/karinto-manju.svg" alt="かりんとう饅頭のイメージ画像">
      <h2>かりんとう饅頭</h2>
      <p>カリッと香ばしい皮の中に、やさしい甘さのあんこ。</p>
    </article>

    <article class="card">
      <img src="images/dango.svg" alt="お団子のイメージ画像">
      <h2>お団子</h2>
      <p>もちもちの食感がたまらない、和のおやつ。</p>
    </article>

    <article class="card">
      <img src="images/chiffon.svg" alt="シフォンケーキのイメージ画像">
      <h2>シフォンケーキ</h2>
      <p>空気を含んだふわふわの生地が、口の中でほどける。</p>
    </article>

    <article class="card">
      <img src="images/cheesecake.svg" alt="チーズケーキのイメージ画像">
      <h2>チーズケーキ</h2>
      <p>濃厚なコクとほどよい酸味で、満足感のあるひと切れ。</p>
    </article>
  </main>
</body>
</html>
